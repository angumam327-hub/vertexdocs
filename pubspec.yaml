name: vertexdocs
description: "VertexDocs Mobile - Professional document and PDF management application by JM Vertex Technologies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  http: ^1.2.2
  intl: ^0.19.0
  syncfusion_flutter_pdf: ^27.1.58
  syncfusion_flutter_pdfviewer: ^27.1.58
  pdfx: ^2.6.0
  pdf: ^3.11.1
  shared_preferences: ^2.3.2
  image: 4.8.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  archive: ^4.0.7
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
